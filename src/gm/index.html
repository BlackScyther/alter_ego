<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&amp;D 4e — GM Console</title>
  <link rel="stylesheet" href="../app.css" />
  <link rel="stylesheet" href="gm.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="gm-shell">
    <nav class="editor-nav gm-nav" aria-label="GM navigation">
      <h1>GM Console</h1>
      <a href="../launcher/index.html">← Alter Ego home</a>
      <a href="workshop/index.html">Workshop</a>
      <a href="campaigns/index.html">Campaigns</a>
      <a href="campaigns/encounters/index.html">Encounters</a>
      <a href="../resources/index.html">Resources</a>
      <a class="nav-github" href="https://github.com/BlackScyther/alter_ego" target="_blank" rel="noopener noreferrer" aria-label="View this project on GitHub" title="View on GitHub" style="margin-top:auto">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </nav>

    <main class="editor-main gm-main">
      <section id="gm-campaign-stats" class="gm-campaign-panel rounded-xl border border-slate-700 bg-slate-900/80 p-4 mb-6">
        <h2 class="text-lg font-semibold m-0">Online campaigns</h2>
        <p id="gm-campaign-stats-text" class="text-sm text-slate-400 mt-2 mb-0">Loading…</p>
        <a href="campaigns/index.html" class="btn-secondary inline-block mt-4 min-h-11 leading-[2.75rem] px-4">
          Manage campaigns
        </a>
      </section>

      <section id="gm-quick-build" class="gm-quick-build rounded-xl border border-slate-700 bg-slate-900/80 p-4 mb-6">
        <h2 class="text-lg font-semibold m-0">Quick-build character</h2>
        <p class="text-sm text-slate-400 mt-2">
          GM only: enter race, class, and level (1–30). Feats, abilities, and name are filled automatically.
        </p>
        <div class="gm-quick-build-grid mt-4">
          <label class="gm-qb-field">
            <span class="text-sm text-slate-400">Race</span>
            <input type="text" id="qb-race" class="mt-1 w-full rounded border border-slate-600 bg-slate-800 px-3 py-2" value="Human" autocomplete="off" />
          </label>
          <label class="gm-qb-field">
            <span class="text-sm text-slate-400">Class</span>
            <input type="text" id="qb-class" class="mt-1 w-full rounded border border-slate-600 bg-slate-800 px-3 py-2" value="Fighter" list="qb-class-list" autocomplete="off" />
            <datalist id="qb-class-list">
              <option value="Fighter"></option>
              <option value="Cleric"></option>
              <option value="Wizard"></option>
            </datalist>
          </label>
          <label class="gm-qb-field">
            <span class="text-sm text-slate-400">Level</span>
            <input type="number" id="qb-level" class="mt-1 w-full rounded border border-slate-600 bg-slate-800 px-3 py-2" min="1" max="30" value="1" />
          </label>
          <label class="gm-qb-field gm-qb-field--wide">
            <span class="text-sm text-slate-400">Character name (optional)</span>
            <input type="text" id="qb-name" class="mt-1 w-full rounded border border-slate-600 bg-slate-800 px-3 py-2" placeholder="Random name if empty" />
          </label>
        </div>
        <button type="button" class="btn-primary mt-4 min-h-11" id="btn-quick-build">Quick-create character</button>
      </section>

      <ul class="validation-errors" id="gm-errors" hidden></ul>
    </main>
  </div>

  <script type="module" src="gm.js"></script>
</body>
</html>
