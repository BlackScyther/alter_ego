<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alter Ego</title>
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="hub-page">
  <main class="hub-shell" aria-label="Choose your role">
    <header class="hub-header">
      <h1 class="hub-title hub-title--logo">
        <img
          src="../assets/alter-ego-logo.png"
          alt="4E Alter Ego — character generator for D&amp;D 4th Edition"
          class="hub-logo"
          width="280"
          height="280"
        />
      </h1>
      <p class="hub-lead">Who is using this computer?</p>
    </header>

    <nav class="hub-nav" aria-label="Role selection">
      <a href="../join/index.html" class="hub-link">Have a player invite link?</a>
      <a id="btn-player" href="../player/index.html" class="hub-btn hub-btn-primary">I am a player</a>
      <a id="btn-gm" href="../gm/index.html" class="hub-btn hub-btn-secondary">I am the GM</a>
    </nav>

    <aside class="hub-infobox">
      <p>
        <strong>Online:</strong> GM creates a campaign, players join via link and click Save.
        No accounts — optional JSON export as backup.
      </p>
    </aside>

    <label class="hub-remember">
      <input type="checkbox" id="remember-role" />
      Remember my choice next time
    </label>
  </main>
  <script type="module" src="launcher.js"></script>
</body>
</html>
