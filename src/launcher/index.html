<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alter Ego</title>
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main
    class="min-h-screen flex flex-col items-center justify-center gap-8 px-6 max-w-md mx-auto"
    aria-label="Choose your role"
  >
    <header class="text-center">
      <p class="text-sm uppercase tracking-widest text-amber-500/90 font-semibold">Dungeons &amp; Dragons 4e</p>
      <h1 class="mt-2 text-2xl font-semibold text-slate-100">Alter Ego</h1>
      <p class="mt-3 text-base text-slate-400">Who is using this computer?</p>
    </header>

    <nav class="flex flex-col gap-4 w-full" aria-label="Role selection">
      <a
        href="../join/index.html"
        class="text-center text-sm text-amber-500/90 hover:text-amber-400 no-underline -mb-2"
      >
        Have a player invite link?
      </a>
      <a
        id="btn-player"
        href="../player/index.html"
        class="min-h-14 flex items-center justify-center rounded-xl bg-amber-600 px-6 py-4 text-lg font-semibold text-slate-950 hover:bg-amber-500 no-underline"
      >
        I am a player
      </a>
      <a
        id="btn-gm"
        href="../gm/index.html"
        class="min-h-14 flex items-center justify-center rounded-xl border border-slate-600 bg-slate-800 px-6 py-4 text-lg font-semibold text-slate-100 hover:bg-slate-700 no-underline"
      >
        I am the GM
      </a>
    </nav>

    <p class="text-sm text-slate-500 text-center">
      <strong class="text-slate-400">Online:</strong> GM creates a campaign, players join via link and click Save.
      No accounts — optional JSON export as backup.
    </p>

    <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
      <input type="checkbox" id="remember-role" class="rounded border-slate-600" />
      Remember my choice next time
    </label>
  </main>
  <script type="module" src="launcher.js"></script>
</body>
</html>
