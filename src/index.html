<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&amp;D 4e — Home</title>
  <link rel="stylesheet" href="app.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('dnd4e.rememberRole') === '1') {
          var role = localStorage.getItem('dnd4e.preferredRole');
          if (role === 'player' || role === 'gm') {
            window.location.replace(role === 'gm' ? 'gm/index.html' : 'player/index.html');
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main
    class="min-h-screen flex flex-col items-center justify-center gap-8 px-6"
    aria-label="Choose application"
  >
    <header class="text-center">
      <p class="text-sm uppercase tracking-widest text-amber-500/90 font-semibold">Dungeons &amp; Dragons 4e</p>
      <h1 class="mt-2 text-2xl font-semibold text-slate-100">Character tools</h1>
    </header>

    <nav class="flex flex-col gap-4 w-full max-w-md" aria-label="Main menu">
      <a
        href="launcher/index.html"
        class="text-center text-sm text-slate-500 hover:text-slate-300 no-underline mb-2"
      >
        ← Role picker (player / GM)
      </a>
      <a
        href="editor/index.html"
        class="min-h-14 flex items-center justify-center rounded-xl bg-amber-600 px-6 py-4 text-lg font-semibold text-slate-950 hover:bg-amber-500 no-underline"
      >
        Character generator
      </a>
      <a
        href="playlist/index.html"
        class="min-h-14 flex items-center justify-center rounded-xl border border-slate-600 bg-slate-800 px-6 py-4 text-lg font-semibold text-slate-100 hover:bg-slate-700 no-underline"
      >
        Top of playlist
      </a>
    </nav>
  </main>
  <script type="module">
    import { initBuildStamp } from './shared/build-stamp.js';
    initBuildStamp();
  </script>
</body>
</html>
