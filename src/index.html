<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&amp;D 4e — Home</title>
  <link rel="stylesheet" href="app.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('dnd4e.rememberRole') === '1') {
          var role = localStorage.getItem('dnd4e.preferredRole');
          if (role === 'player' || role === 'gm') {
            window.location.replace(role === 'gm' ? 'gm/index.html' : 'player/index.html');
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body class="hub-page">
  <main class="hub-shell" aria-label="Choose application">
    <header class="hub-header">
      <h1 class="hub-title hub-title--logo">
        <img
          src="assets/alter-ego-logo.png"
          alt="4E Alter Ego — character generator for D&amp;D 4th Edition"
          class="hub-logo"
          width="280"
          height="280"
        />
      </h1>
    </header>

    <nav class="hub-nav" aria-label="Main menu">
      <a href="launcher/index.html" class="hub-link">← Role picker (player / GM)</a>
      <a href="editor/index.html" class="hub-btn hub-btn-primary">Character generator</a>
      <a href="playlist/index.html" class="hub-btn hub-btn-secondary">Top of playlist</a>
      <a href="feedback/index.html" class="hub-link">Send feedback</a>
    </nav>
  </main>
  <script type="module">
    import { initBuildStamp } from './shared/build-stamp.js';
    initBuildStamp();
  </script>
</body>
</html>
