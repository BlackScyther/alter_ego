<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rule cards</title>
  <link rel="stylesheet" href="cards.css" />
</head>
<body>
  <div class="cards-toolbar" id="cards-toolbar">
    <h1 class="cards-toolbar-title" id="cards-title">Rule cards</h1>
    <div class="cards-toolbar-actions">
      <button type="button" id="cards-print">Print</button>
      <button type="button" id="cards-close">Close</button>
    </div>
  </div>
  <main class="cards-page">
    <div id="cards-grid" class="cards-status">Loading rule cards...</div>
  </main>
  <script type="module" src="cards.js"></script>
</body>
</html>
